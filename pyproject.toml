[project]
name = "thessley-passkey-linux"
version = "0.1.0"
description = "Thessley Passkey for Linux desktops: approve Thessley Passkey logins with a PIN or FIDO2 security key"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
dependencies = ["cryptography", "requests", "fido2>=1.2"]

[project.scripts]
thessley-passkey = "thessley_passkey.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
